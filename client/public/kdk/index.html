<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>KDK モック（閲覧キー）</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans",
          "Apple Color Emoji", "Segoe UI Emoji";
      }
      .wrap {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(520px, 100%);
        border: 1px solid rgba(127, 127, 127, 0.25);
        border-radius: 14px;
        padding: 20px;
        background: rgba(127, 127, 127, 0.06);
      }
      h1 {
        font-size: 18px;
        margin: 0 0 6px;
      }
      p {
        margin: 0 0 14px;
        opacity: 0.8;
        font-size: 14px;
        line-height: 1.5;
      }
      .row {
        display: flex;
        gap: 10px;
      }
      input {
        flex: 1;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid rgba(127, 127, 127, 0.3);
        background: transparent;
        font-size: 14px;
      }
      button {
        padding: 10px 14px;
        border-radius: 10px;
        border: 1px solid rgba(127, 127, 127, 0.3);
        background: rgba(127, 127, 127, 0.15);
        cursor: pointer;
        font-size: 14px;
      }
      #err {
        margin-top: 10px;
        font-size: 13px;
        color: #d33;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>KDK モック（閲覧キー）</h1>
        <p>
          これは一般公開用ではありません。アクセスキーを入力してください（※静的サイトのため秘匿用途ではありません）。
        </p>
        <div class="row">
          <input id="key" type="password" placeholder="アクセスキー" />
          <button id="go" type="button">入室</button>
        </div>
        <div id="err" aria-live="polite"></div>
      </div>
    </div>

    <script>
      (function () {
        var EXPECTED = "kdk";
        var SESSION_KEY = "kdk_mockup_unlocked";
        var GATE_PATHS = { "/kdk": 1, "/kdk/": 1, "/kdk/index.html": 1 };

        function safeNext() {
          try {
            var url = new URL(window.location.href);
            var next = url.searchParams.get("next");
            if (!next) return null;
            var decoded = decodeURIComponent(next);
            var q = decoded.indexOf("?");
            if (q !== -1) decoded = decoded.slice(0, q);
            var h = decoded.indexOf("#");
            if (h !== -1) decoded = decoded.slice(0, h);
            if (!decoded.startsWith("/kdk/site/")) return null;
            if (GATE_PATHS[decoded]) return null;
            return decoded;
          } catch (e) {
            return null;
          }
        }

        function go(next) {
          window.location.assign(next || "/kdk/site/index.html");
        }

        try {
          if (window.sessionStorage.getItem(SESSION_KEY) === "1") {
            go(safeNext());
            return;
          }
        } catch (e) {}

        var input = document.getElementById("key");
        var button = document.getElementById("go");
        var err = document.getElementById("err");

        function submit() {
          var v = (input.value || "").trim();
          if (v !== EXPECTED) {
            err.textContent = "アクセスキーが一致しません。";
            return;
          }
          err.textContent = "";
          try {
            window.sessionStorage.setItem(SESSION_KEY, "1");
          } catch (e) {}
          go(safeNext());
        }

        button.addEventListener("click", submit);
        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") submit();
        });
      })();
    </script>
  </body>
</html>
